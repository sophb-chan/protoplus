name: Release to GitHub (on version bump)

on:
  workflow_run:
    workflows: ["Construct modules"]
    types:
      - completed
    branches:
      - main

jobs:
  check-and-release:
    # Don't release off a failed (or skipped) constructor run.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # workflow_run events default to the default branch; pin it explicitly
          # so we always see the constructor's automated commit if there was one.
          ref: main
          fetch-depth: 0

      - name: Get version from `package.json`
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version extracted: v$VERSION"

      - name: Check whether the tag already exists
        id: check-tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.get-version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.get-version.outputs.version }} already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            protoplus.js
            protoplus.mjs
            protoplus.cjs
          fail_on_unmatched_files: true
          tag_name: ${{ steps.get-version.outputs.version }}
          name: ${{ steps.get-version.outputs.version }}
          generate_release_notes: true
