name: Publish to NPM (on version bump)

on:
  # Triggered by the same upstream as "Release to GitHub (on version bump)",
  # so publishing does NOT depend on the release workflow running or succeeding.
  # The npm-registry existence check below keeps this a no-op when the version
  # hasn't been bumped.
  workflow_run:
    workflows: ["Construct modules"]
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # Don't publish off a failed (or skipped) constructor run.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci

      - name: Check if this version is already on npm
        id: check-npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "protoplus@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "protoplus@$VERSION is already published; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # npm refuses to publish prerelease versions without an explicit --tag.
      # Stable versions go to `latest` (what the README's CDN links use);
      # prereleases go to `next`.
      - name: Determine dist-tag
        id: dist-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package contents
        if: steps.check-npm.outputs.skip == 'false'
        run: npm pack --dry-run

      # OIDC trusted publishing: no NODE_AUTH_TOKEN needed as long as this
      # repository + workflow file are configured as a trusted publisher for
      # the `protoplus` package on npmjs.com. --provenance attaches an
      # attestation.
      - name: Publish to npm
        if: steps.check-npm.outputs.skip == 'false'
        run: npm publish --provenance --tag ${{ steps.dist-tag.outputs.tag }}
